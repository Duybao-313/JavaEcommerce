
spring:
  application:
   name: SplitGo
  datasource:
    url: ${DBMS_CONNECTION:jdbc:mysql://localhost:3306/ecommerce?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC }
    username: ${DBMS_USERNAME:root}
    password: ${DBMS_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  thymeleaf:
    cache: false
    prefix: classpath:/templates/


jwt:
  secret: "q9v8G3s2r4Yt1KfVb6s9X2mQp7L0uH8nZ5yR0wVxC1aB7dE4fG6hJkL9mN0oPqR2sT3uVwXyZ+AbCdEfGhIjKlMBaoBaoBao"
  token-duration: 3600000
  refresh-duration: 600000

# SePay Payment Gateway Configuration
sepay:
  merchant-id: ${SEPAY_MERCHANT_ID:SP-LIVE-PD395947}
  secret-key: ${SEPAY_SECRET_KEY:REPLACED}
  base-url: ${SEPAY_BASE_URL:https://pay.sepay.vn}
  success-url: ${SEPAY_SUCCESS_URL:http://localhost:8080/payments/sepay/success}
  error-url: ${SEPAY_ERROR_URL:http://localhost:8080/payments/sepay/error}
  cancel-url: ${SEPAY_CANCEL_URL:http://localhost:8080/payments/sepay/cancel}
  ipn-url: ${SEPAY_IPN_URL:https://your-domain.com/payments/sepay/ipn}

# Application
app:
  base-url: ${APP_BASE_URL:http://localhost:3000}